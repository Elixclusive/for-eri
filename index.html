<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>For You</title>

  <style>
    /* ---------- colors ---------- */
    :root {
      --bg: #fff0f3;
      --card: #ffffff;
      --text: #4a1f2b;
      --accent: #e63e6d;
      --soft: #ffd3de;
    }

    /* dark mode colors (if her phone is in dark mode) */
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #2a1018;
        --card: #3d1a26;
        --text: #ffe3ea;
        --accent: #ff6b92;
        --soft: #5a2536;
      }
    }

    :root[data-theme="dark"] {
      --bg: #2a1018;
      --card: #3d1a26;
      --text: #ffe3ea;
      --accent: #ff6b92;
      --soft: #5a2536;
    }

    /* ---------- basic page setup ---------- */
    html {
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      scroll-padding-top: env(safe-area-inset-top, 0px);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
      text-align: center;
      overflow-x: hidden;
    }

    /* keeps the content on top of the floating background hearts */
    body > *:not(#bg):not(.fl):not(script):not(#popup):not(#intro):not(#gate) {
      position: relative;
      z-index: 1;
    }

    h1 {
      font-size: 2rem;
      margin: 8px 0;
    }

    p.sub {
      margin: 0 0 20px;
      opacity: 0.85;
    }

    .hide {
      display: none;
    }

    /* ---------- loading intro ---------- */
    #intro {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 15%, var(--soft), transparent 55%),
        radial-gradient(circle at 80% 85%, var(--soft), transparent 55%),
        var(--bg);
      transition: opacity 1.2s ease;
    }

    #intro.gone {
      opacity: 0;
      pointer-events: none;
    }

    .introheart {
      font-size: 5rem;
      animation: pulse 1.2s ease-in-out infinite;
    }

    #introtitle {
      margin: 14px 0 6px;
      font-size: clamp(2.2rem, 10vw, 3.4rem);
      color: var(--accent);
      opacity: 0;
      animation: introfade 2.5s ease 1s forwards;
    }

    @keyframes introfade {
      to { opacity: 1; }
    }

    #intromsg {
      min-height: 1.5em;
      margin: 0 0 22px;
      opacity: 0.85;
    }

    .introbar {
      width: min(260px, 70vw);
      height: 10px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--soft);
    }

    #introfill {
      width: 0;
      height: 100%;
      border-radius: 999px;
      background: var(--accent);
      transition: width 10s linear;
    }

    /* ---------- floating background ---------- */
    #bg {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(circle at 15% 10%, var(--soft), transparent 55%),
        radial-gradient(circle at 85% 90%, var(--soft), transparent 55%);
    }

    .bh {
      position: absolute;
      bottom: -50px;
      opacity: 0.35;
      animation: bgup linear infinite;
    }

    @keyframes bgup {
      from { transform: translateY(0) rotate(-15deg); }
      to   { transform: translateY(-115vh) rotate(25deg); }
    }

    /* hearts that pop up when she clicks stuff */
    .fl {
      position: fixed;
      bottom: -30px;
      font-size: 24px;
      pointer-events: none;
      animation: up 3s linear forwards;
    }

    @keyframes up {
      to { transform: translateY(-110vh); opacity: 0; }
    }

    /* on the BIG last page, flying hearts show on top of the pop-up */
    body.bigmode .fl {
      z-index: 10;
    }

    /* ---------- heart cards (page 1) ---------- */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 12px;
      max-width: 560px;
      margin: 0 auto 28px;
    }

    .card {
      background: var(--card);
      border: 2px solid var(--soft);
      border-radius: 16px;
      padding: 18px 10px;
      min-height: 120px;
      cursor: pointer;
      font: inherit;
      color: var(--text);
      transition: transform 0.2s;
    }

    .card:hover {
      transform: scale(1.04);
    }

    .card .h {
      font-size: 2.2rem;
    }

    .card .t {
      display: none;
      font-size: 0.95rem;
      line-height: 1.4;
    }

    .card.open {
      border-color: var(--accent);
    }

    .card.open .t {
      display: block;
    }

    .card.open .h {
      display: none;
    }

    #cnt {
      margin-top: 16px;
      opacity: 0.8;
    }

    /* ---------- question box + buttons ---------- */
    .q {
      max-width: 560px;
      margin: 0 auto;
      height: 190px;
      padding: 20px;
      background: var(--card);
      border: 2px solid var(--soft);
      border-radius: 16px;
      position: relative;
    }

    .q h2 {
      margin: 0 0 14px;
      font-size: 1.3rem;
    }

    button.b {
      font: inherit;
      font-size: 1rem;
      padding: 12px 26px;
      border: 0;
      border-radius: 999px;
      cursor: pointer;
    }

    .yes {
      background: var(--accent);
      color: #fff;
    }

    .yes:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* the "No" buttons that run away */
    .no {
      position: absolute;
      left: 55%;
      top: 90px;
      background: var(--soft);
      color: var(--text);
    }

    /* ---------- pop-up note ---------- */
    #popup {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 5;
      padding: 20px;
      background: rgba(0, 0, 0, 0.5);
      align-items: center;
      justify-content: center;
    }

    #popup.show {
      display: flex;
    }

    .pop {
      width: 100%;
      max-width: 420px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
      background: var(--card);
      border: 2px solid var(--accent);
      border-radius: 16px;
    }

    #finalnote {
      margin: 0 0 18px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    /* page counter like "1 / 3" */
    #pagenum {
      margin: 0 0 14px;
      font-size: 0.9rem;
      opacity: 0.7;
    }

    /* Back + Next buttons row */
    .popbtns {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .back {
      background: var(--soft);
      color: var(--text);
    }

    /* ---------- the BIG "I love you" last page ---------- */
    #bigtext {
      display: none;
      margin: 10px 0 24px;
      font-size: clamp(2rem, 9vw, 2.8rem);
      line-height: 1.2;
      color: var(--accent);
      white-space: pre-wrap;
    }

    /* when the pop-up is on the big page: show big text, hide normal text */
    .pop.big #bigtext {
      display: block;
    }

    .pop.big #finalnote,
    .pop.big #pagenum {
      display: none;
    }

    /* on the big page there is no Next/close button (she must tap the heart) */
    .pop.big #closepop {
      display: none;
    }

    /* the long question ("may I spend the christmas...") */
    #bigtext.long {
      font-size: clamp(1.3rem, 5.5vw, 1.9rem);
      line-height: 1.4;
    }

    /* the final "court you?" reveal */
    #bigtext.grand {
      font-size: clamp(2.3rem, 11vw, 3.4rem);
    }

    /* the heart she has to tap */
    #tapbox {
      display: none;
      margin: 0 0 18px;
    }

    .pop.big #tapbox {
      display: block;
    }

    #taphint {
      margin: 0 0 6px;
      opacity: 0.85;
    }

    #tapbtn {
      font-size: 4rem;
      line-height: 1;
      padding: 6px;
      background: none;
      border: 0;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
      transition: transform 0.1s;
    }

    #tapcount {
      margin: 6px 0 0;
      font-size: 1.1rem;
      opacity: 0.8;
    }

    /* hearts in the corners (only show on the big page) */
    .corner {
      display: none;
      position: fixed;
      font-size: 3rem;
      animation: pulse 1.4s ease-in-out infinite;
    }

    #popup.bigmode .corner {
      display: block;
    }

    .tl { top: 12px;    left: 12px; }
    .tr { top: 12px;    right: 12px; }
    .bl { bottom: 12px; left: 12px; }
    .br { bottom: 12px; right: 12px; }

    /* the smaller hearts next to the big corner hearts */
    .tl2, .tr2, .bl2, .br2 {
      font-size: 2rem;
      animation-delay: 0.5s;
    }

    .tl2 { top: 70px;    left: 14px; }
    .tr2 { top: 70px;    right: 14px; }
    .bl2 { bottom: 70px; left: 14px; }
    .br2 { bottom: 70px; right: 14px; }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.25); }
    }

    /* ---------- animations ---------- */
    @keyframes pagein {
      from { opacity: 0; transform: translateY(24px) scale(0.97); }
      to   { opacity: 1; transform: none; }
    }
    .pagein { animation: pagein 0.7s cubic-bezier(0.2, 0.9, 0.3, 1) both; }

    @keyframes swap {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: none; }
    }
    .swap { animation: swap 0.5s ease both; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-9px); }
      40% { transform: translateX(9px); }
      60% { transform: translateX(-6px); }
      80% { transform: translateX(6px); }
    }
    .shake { animation: shake 0.45s ease; }

    @keyframes cardin {
      from { opacity: 0; transform: translateY(30px) scale(0.8); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes cardopen {
      0%   { transform: rotateY(90deg) scale(0.8); }
      60%  { transform: rotateY(-10deg) scale(1.06); }
      100% { transform: none; }
    }
    /* cards drop in one by one once the intro is over */
    body.started .card {
      animation: cardin 0.6s cubic-bezier(0.2, 1.2, 0.4, 1) backwards;
      animation-delay: calc(var(--i, 0) * 80ms);
    }
    body.started .card.open {
      animation: cardopen 0.5s ease;
      animation-delay: 0s;
    }
    .card:hover .h { display: inline-block; animation: wiggle 0.5s ease; }
    @keyframes wiggle {
      0%, 100% { transform: rotate(0); }
      25% { transform: rotate(-12deg) scale(1.15); }
      75% { transform: rotate(12deg) scale(1.15); }
    }

    /* buttons: lift, press, glow, and smooth running-away */
    button.b { transition: transform 0.15s ease, box-shadow 0.2s ease, opacity 0.2s ease; }
    button.b:not(.no):not(:disabled):hover { transform: translateY(-3px); }
    button.b:not(.no):not(:disabled):active { transform: scale(0.94); }
    button.b.no {
      transition: left 0.4s cubic-bezier(0.3, 1.4, 0.5, 1), top 0.4s cubic-bezier(0.3, 1.4, 0.5, 1);
    }
    @keyframes glow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(230, 62, 109, 0.5); }
      50%      { box-shadow: 0 0 0 12px rgba(230, 62, 109, 0); }
    }
    .yes:not(:disabled) { animation: glow 2s ease-in-out infinite; }

    /* pop-up: backdrop fades, box bounces in */
    @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
    @keyframes popin {
      from { opacity: 0; transform: scale(0.8) translateY(30px); }
      to   { opacity: 1; transform: none; }
    }
    #popup.show { animation: fadein 0.4s ease; }
    #popup.show .pop { animation: popin 0.5s cubic-bezier(0.2, 1.3, 0.4, 1) backwards; }

    #bigtext.grand { animation: swap 0.8s ease both; }

    /* ---------- the surprise before "court you?" ---------- */
    #surprise { display: none; margin: 0 0 18px; }
    .sbar {
      width: min(240px, 70vw);
      height: 10px;
      margin: 0 auto 12px;
      overflow: hidden;
      border-radius: 999px;
      background: var(--soft);
    }
    #sfill {
      width: 0;
      height: 100%;
      border-radius: 999px;
      background: var(--accent);
      transition: width 6s linear;
    }
    #smsg { min-height: 1.4em; margin: 0 0 14px; opacity: 0.9; }

    /* bright flash right before the reveal */
    #flash {
      position: fixed;
      inset: 0;
      z-index: 3;
      background: #fff;
      opacity: 0;
      pointer-events: none;
    }
    #flash.go { animation: flashgo 1.3s ease; }
    @keyframes flashgo {
      0%   { opacity: 0; }
      25%  { opacity: 0.9; }
      100% { opacity: 0; }
    }

    /* ---------- name gate (password) ---------- */
    #gate {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 15;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 15%, var(--soft), transparent 55%),
        radial-gradient(circle at 80% 85%, var(--soft), transparent 55%),
        var(--bg);
      transition: opacity 1s ease;
    }
    #gate.gone { opacity: 0; pointer-events: none; }
    .gateheart { font-size: 4rem; animation: pulse 1.4s ease-in-out infinite; }
    #gateinput {
      font: inherit;
      font-size: 1.1rem;
      width: min(260px, 75vw);
      margin: 0 0 14px;
      padding: 12px 16px;
      background: var(--card);
      color: var(--text);
      border: 2px solid var(--soft);
      border-radius: 999px;
      text-align: center;
    }
    #gateinput:focus { outline: none; border-color: var(--accent); }
    #gatemsg { min-height: 1.4em; margin: 14px 0 0; }

    /* ---------- math page ---------- */
    #mq {
      font-size: 1.1rem;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    #ans {
      font: inherit;
      font-size: 1.1rem;
      width: 70%;
      max-width: 240px;
      margin: 0 8px 10px;
      padding: 10px 14px;
      background: var(--bg);
      color: var(--text);
      border: 2px solid var(--soft);
      border-radius: 999px;
      text-align: center;
    }

    #mmsg {
      min-height: 1.4em;
      margin: 12px 0 0;
    }
  </style>
</head>

<body>
  <!-- LOADING INTRO -->

      "galing, tangina! iloveyoy\n\nHello babi! these past few weeks were really something eh, no? ang daming nangyare, ang daming mga ganap and stuff and parang katarantaduhan nalang lahat lahat ng asa paligid natin, but through all those chaos, tangina, i found you, you found me, and that's something. honestly, hindi ako marunong sa mga words kung pano mag-express but i'll try my best, oki my babi?",
      "babi, ever since I met you, I've been really happy, sobra-sobra pa. I am not the type to smile much but somehow, when I met you. I see myself smiling ng sobra-sobra and seeing myself do so feels like healing. the way you love me, see me and pagpapakita ng efforts and stuff, especially showing up, means so much to me. being loved by you and loving you feels like living and not surviving. the way you treat me feels like I deserve this, na parang hindi ako mahirap mahalin. and I am thankful and grateful palagi for being loved like this, being loved by you.",
      "everyone in my past feels like I had to wear a mask just to fit. but you, you showed me na it's okay, it's okay to express the things i love and the things that i wanna do while you're there watching me do yung mga gusto ko, but of course, with you rin. after all those things na napagdaanan ko, I am finally breathing. Thank you so much, my babi. Thank you for making me feel na kamahal-mahal ako and thank you for being my other half na. we share a lot as if we are one person and it still blows my mind hanggang ngayon HAHAHAHAHA, thank you so much, my lovergirl. \n\nMahal na mahal kita.",
      "__BIG__"
    ];

    // THE BIG PAGE: she taps the heart many times
    var BIG_LOVE = "Mahal na mahal kita ng sobra, Erin.\n ";                                    // (\n = new line)
    var BIG_HINT = "click mo na yung heart ng {n} beses, babi! 💖";             // {n} becomes the number
    var HEART_CLICKS = 20;                                                      // how many taps

    // THE QUESTION: types out in parts, then she taps a button many times
    var ASK_PART1 = "alam ko medyo maano pa yung time, but may I spend the christmas and other holidays with you";
    var ASK_PAUSE = 2500;                    // pause after "with you" (ms)
    var ASK_PART2 = ", and the following years?";
    var ASK_PART3 = "may I know you even more?";
    var ASK_DOT_SPEED = 1800;                // time between each dot before the last line (ms)
    var ASK_HINT = "isa pa, pindutin mo ng {n} beses, babi!";
    var ASK_BUTTON = "💌";                                                      // the thing she taps
    var ASK_CLICKS = 10;                                                        // how many taps

    // THE REVEAL: "may I" ... dots show up slowly ... "court you?"
    var REVEAL_START = "may I";
    var REVEAL_END = "court you?";
    var DOT_SPEED = 2000;            // time between each dot in milliseconds (bigger number = slower)
    var REVEAL_TYPE_SPEED = 220;     // speed of "court you?" (ms per letter, bigger = slower)

    // THE SURPRISE: after "may I...", a loading bar, then she has to click before "court you?" shows
    var SURPRISE_TIME = 6000;        // how long the loading lasts (ms)
    var SURPRISE_MSGS = [
      "sandali lang, babi...",
      "kinakabahan ako ha 🫣",
      "konti nalang...",
      "ayan na talaga 💕"
    ];
    var SURPRISE_READY = "ready ka na ba, babi?";
    var SURPRISE_BUTTON = "oo, ready na ako 💖";

    // HOW SLOW THE WORDS TYPE (like you are talking)
    var TYPE_SPEED = 70;      // time between each letter in milliseconds (bigger number = slower)
    var PAUSE_SPEED = 400;    // extra pause after a comma, period, or question mark


    /* =====================================================
       CODE (no need to edit below this line)
       ===================================================== */

    // grab the stuff we need from the page
    var gridBox = document.getElementById("grid");
    var counterText = document.getElementById("cnt");
    var yesButton = document.getElementById("yes");
    var noButton = document.getElementById("no");
    var pagesBox = document.getElementById("pages");
    var popupBox = document.getElementById("popup");
    var closeButton = document.getElementById("closepop");
    var backButton = document.getElementById("backbtn");
    var noteText = document.getElementById("finalnote");
    var bigText = document.getElementById("bigtext");
    var pageCounter = document.getElementById("pagenum");
    var tapBox = document.getElementById("tapbox");
    var tapHint = document.getElementById("taphint");
    var tapButton = document.getElementById("tapbtn");
    var tapCount = document.getElementById("tapcount");

    var heartsOpened = 0;
    var extraPages = [];          // pages 2 and 3 go in here
    var afterPopupClose = null;   // what to do when the pop-up gets closed

    // for the pop-up note pages
    var popupPages = [];          // the pages of the note
    var popupIndex = 0;           // which page she is on now
    var popupCloseText = "";      // text of the button on the very last page
    var defaultCloseText = closeButton.textContent;
    var bigTimer = null;          // keeps the hearts flying on the BIG page

    // for the "tap many times" parts
    var tapsDone = 0;
    var tapsNeeded = 0;
    var tapFinished = null;       // what happens after the last tap

    // for the slow typing
    var typeTimer = null;


    // ----- set the starting text -----
    document.getElementById("title").textContent = "Hi, " + NAME + " 💕";
    document.getElementById("question").textContent = QUESTION;
    counterText.textContent = "Hearts opened: 0 / " + NOTES.length + " — " + LOCKED_TEXT;

    document.getElementById("mtitle").textContent = MATH_TITLE;
    document.getElementById("msub").textContent = MATH_SUB;
    document.getElementById("mq").textContent = MATH_QUESTION;


    // ----- restarts a css animation on an element -----
    function replay(el, cls) {
      el.classList.remove(cls);
      void el.offsetWidth;
      el.classList.add(cls);
    }


    // ----- little hearts that fly up when she clicks -----
    function shootHearts(amount) {
      var emojis = ["💖", "💕", "💗", "❤️"];

      for (var i = 0; i < amount; i++) {
        var heart = document.createElement("div");
        heart.className = "fl";
        heart.textContent = emojis[i % emojis.length];
        heart.style.left = (Math.random() * 90 + 5) + "vw";
        heart.style.animationDelay = (Math.random() * 0.6) + "s";
        document.body.appendChild(heart);

        // remove it after a few seconds so the page doesn't get heavy
        setTimeout(function (el) {
          el.remove();
        }, 4000, heart);
      }
    }


    // ----- floating background hearts -----
    var bgBox = document.getElementById("bg");
    var bgIcons = ["💖", "💕", "💗", "❤️", "🌸", "✨"];

    for (var k = 0; k < 28; k++) {
      var floater = document.createElement("div");
      floater.className = "bh";
      floater.textContent = bgIcons[k % bgIcons.length];
      floater.style.left = (Math.random() * 95) + "vw";
      floater.style.fontSize = (14 + Math.random() * 26) + "px";
      floater.style.animationDuration = (8 + Math.random() * 10) + "s";
      floater.style.animationDelay = (-Math.random() * 14) + "s";
      bgBox.appendChild(floater);
    }


    // ----- the heart cards on page 1 -----
    NOTES.forEach(function (heartNote, idx) {
      var card = document.createElement("button");
      card.className = "card";
      card.style.setProperty("--i", idx);
      card.innerHTML = '<div class="h">💗</div><div class="t"></div>';
      card.querySelector(".t").textContent = heartNote;

      card.onclick = function () {
        // ignore if this heart was already opened
        if (card.classList.contains("open")) {
          return;
        }

        card.classList.add("open");
        heartsOpened++;
        shootHearts(4);

        if (heartsOpened >= NOTES.length) {
          // all hearts opened -> unlock the button
          yesButton.disabled = false;
          counterText.textContent = "Hearts opened: " + heartsOpened + " / " + NOTES.length + " — " + UNLOCKED_TEXT;
        } else {
          counterText.textContent = "Hearts opened: " + heartsOpened + " / " + NOTES.length + " — " + LOCKED_TEXT;
        }
      };

      gridBox.appendChild(card);
    });


    // ----- makes a "No" button run away when she tries to press it -----
    function makeButtonRunAway(button) {
      function moveAway() {
        button.style.left = (Math.random() * 60 + 5) + "%";
        button.style.top = (Math.random() * 110 + 50) + "px";
      }

      button.addEventListener("mouseover", moveAway);
      button.addEventListener("click", moveAway);
      button.addEventListener("touchstart", function (e) {
        e.preventDefault();
        moveAway();
      });
    }

    makeButtonRunAway(noButton);


    // ----- extra heart effects for the BIG last page -----
    function startBigEffects() {
      popupBox.classList.add("bigmode");        // shows the corner hearts
      document.body.classList.add("bigmode");   // puts the flying hearts on top

      if (!bigTimer) {
        shootHearts(15);

        // keep hearts flying non-stop
        bigTimer = setInterval(function () {
          shootHearts(8);
        }, 700);
      }
    }

    function stopBigEffects() {
      popupBox.classList.remove("bigmode");
      document.body.classList.remove("bigmode");

      if (bigTimer) {
        clearInterval(bigTimer);
        bigTimer = null;
      }
    }


    // ----- slow typing, like you are talking -----
    // prefix = words that are already there, fullText = the words to type out
    // speed (optional) = ms per letter, otherwise TYPE_SPEED is used
    function typeText(prefix, fullText, whenDone, speed) {
      var letters = Array.from(fullText);   // Array.from keeps emojis in one piece
      var shown = 0;
      var baseSpeed = speed || TYPE_SPEED;

      clearTimeout(typeTimer);
      bigText.textContent = prefix;

      function typeNextLetter() {
        shown++;
        bigText.textContent = prefix + letters.slice(0, shown).join("");

        // all letters are done
        if (shown >= letters.length) {
          if (whenDone) {
            whenDone();
          }
          return;
        }

        // wait a little longer after , . ? so it feels like talking
        var lastLetter = letters[shown - 1];
        var wait = baseSpeed;

        if (lastLetter === "," || lastLetter === "." || lastLetter === "?") {
          wait += PAUSE_SPEED;
        }

        typeTimer = setTimeout(typeNextLetter, wait);
      }

      typeTimer = setTimeout(typeNextLetter, baseSpeed);
    }


    // ----- three dots that appear slowly after some text -----
    // base = the text already showing, speed = ms between dots
    function showDots(base, speed, whenDone) {
      var dots = 0;

      var dotTimer = setInterval(function () {
        dots++;
        bigText.textContent = base + ".".repeat(dots);

        if (dots >= 3) {
          clearInterval(dotTimer);
          setTimeout(whenDone, speed + 800);   // hold for a moment before moving on
        }
      }, speed);
    }


    // ----- the "tap it many times" parts -----

    // starts a new tap challenge (shows the text, the button, and the counter)
    // slowType = true -> the text types out slowly and the button shows after
    function startChallenge(text, emoji, hint, times, whenDone, isLong, slowType) {
      clearTimeout(typeTimer);
      bigText.classList.remove("grand");

      if (isLong) {
        bigText.classList.add("long");
      } else {
        bigText.classList.remove("long");
      }

      tapHint.textContent = hint.replace("{n}", times);
      tapButton.textContent = emoji;
      tapButton.style.transform = "scale(1)";
      tapCount.textContent = "0 / " + times;

      tapsDone = 0;
      tapsNeeded = times;
      tapFinished = whenDone;

      if (slowType) {
        // hide the button until the words are done
        tapBox.style.display = "none";

        typeText("", text, function () {
          tapBox.style.display = "";
          shootHearts(10);
        });
      } else {
        bigText.textContent = text;
        tapBox.style.display = "";
      }
    }

    // every tap on the heart/button
    tapButton.onclick = function () {
      if (tapsDone >= tapsNeeded) {
        return;
      }

      tapsDone++;
      tapCount.textContent = tapsDone + " / " + tapsNeeded;

      // the heart gets bigger with every tap
      tapButton.style.transform = "scale(" + (1 + (tapsDone / tapsNeeded) * 0.6) + ")";
      shootHearts(3);

      // last tap -> wait a little, then go to the next part
      if (tapsDone >= tapsNeeded) {
        setTimeout(tapFinished, 500);
      }
    };

    // after the heart taps -> the long question types out in parts, then the second button shows
    // "may I spend ... with you" -> pause -> ", and the following years?" -> slow dots -> "may I know you even more?"
    function goToQuestion() {
      backButton.classList.add("hide");   // no going back from here
      shootHearts(30);
      clearTimeout(typeTimer);

      bigText.classList.remove("grand");
      bigText.classList.add("long");

      // set up the tap button (it stays hidden until the words are done)
      tapHint.textContent = ASK_HINT.replace("{n}", ASK_CLICKS);
      tapButton.textContent = ASK_BUTTON;
      tapButton.style.transform = "scale(1)";
      tapCount.textContent = "0 / " + ASK_CLICKS;
      tapsDone = 0;
      tapsNeeded = ASK_CLICKS;
      tapFinished = revealQuestion;
      tapBox.style.display = "none";

      typeText("", ASK_PART1, function () {
        // pause after the last word
        typeTimer = setTimeout(function () {
          typeText(ASK_PART1, ASK_PART2, function () {
            var base = ASK_PART1 + ASK_PART2;

            // slow dots, then the last line
            showDots(base, ASK_DOT_SPEED, function () {
              typeText(base + "...\n", ASK_PART3, function () {
                tapBox.style.display = "";
                shootHearts(10);
              });
            });
          });
        }, ASK_PAUSE);
      });
    }

    // after the second button -> "may I" ... slow dots -> loading -> she clicks -> flash -> "court you?"
    function revealQuestion() {
      tapBox.style.display = "none";
      bigText.classList.remove("long");
      bigText.textContent = REVEAL_START;
      shootHearts(30);

      showDots(REVEAL_START, DOT_SPEED, startSurprise);
    }

    function startSurprise() {
      var box = document.getElementById("surprise");
      var fill = document.getElementById("sfill");
      var msg = document.getElementById("smsg");
      var btn = document.getElementById("sbtn");
      var flash = document.getElementById("flash");
      var i = 0;

      btn.textContent = SURPRISE_BUTTON;
      btn.classList.add("hide");
      msg.textContent = SURPRISE_MSGS[0];
      fill.style.transitionDuration = SURPRISE_TIME + "ms";
      box.style.display = "block";
      replay(box, "swap");

      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          fill.style.width = "100%";
        });
      });

      var msgTimer = setInterval(function () {
        i = Math.min(i + 1, SURPRISE_MSGS.length - 1);
        msg.textContent = SURPRISE_MSGS[i];
      }, SURPRISE_TIME / SURPRISE_MSGS.length);

      // loading done -> she has to click to see the rest
      setTimeout(function () {
        clearInterval(msgTimer);
        msg.textContent = SURPRISE_READY;
        btn.classList.remove("hide");
        shootHearts(10);
      }, SURPRISE_TIME);

      btn.onclick = function () {
        box.style.display = "none";
        replay(flash, "go");
        shootHearts(40);

        // reveal while the flash fades
        setTimeout(function () {
          bigText.classList.add("grand");
          typeText(REVEAL_START + "...\n", REVEAL_END, function () {
            shootHearts(40);
          }, REVEAL_TYPE_SPEED);
        }, 900);
      };
    }


    // ----- the pop-up note (one page or many pages) -----

    // shows the current page of the note
    function drawPopupPage() {
      var lastIndex = popupPages.length - 1;
      var popBox = popupBox.querySelector(".pop");

      noteText.textContent = popupPages[popupIndex];
      replay(noteText, "swap");

      // page counter + Back button only show if there is more than 1 page
      if (popupPages.length > 1) {
        pageCounter.textContent = (popupIndex + 1) + " / " + popupPages.length;
        pageCounter.classList.remove("hide");
      } else {
        pageCounter.classList.add("hide");
      }

      if (popupIndex > 0) {
        backButton.classList.remove("hide");
      } else {
        backButton.classList.add("hide");
      }

      // the main button says "Next" until the last page
      if (popupIndex < lastIndex) {
        closeButton.textContent = "Next ›";
      } else {
        closeButton.textContent = popupCloseText;
      }

      // the BIG "I love you" page (she taps the heart to continue)
      if (popupPages[popupIndex] === "__BIG__") {
        popBox.classList.add("big");
        replay(bigText, "swap");
        startChallenge(BIG_LOVE, "💖", BIG_HINT, HEART_CLICKS, goToQuestion, false, false);
        startBigEffects();
      } else {
        popBox.classList.remove("big");
        stopBigEffects();
      }
    }

    // text can be one string, or a list of strings (= many pages)
    function openPopup(text, nextStep, buttonText) {
      if (Array.isArray(text)) {
        popupPages = text;
      } else {
        popupPages = [text];
      }

      popupIndex = 0;
      popupCloseText = buttonText || defaultCloseText;
      afterPopupClose = nextStep;

      drawPopupPage();
      popupBox.classList.add("show");
      shootHearts(30);
    }

    function showFinalNote() {
      openPopup(FINAL_NOTE, showMathPage);
    }

    // main button: go to the next page, or close on the last page
    closeButton.onclick = function () {
      if (popupIndex < popupPages.length - 1) {
        popupIndex++;
        drawPopupPage();
        shootHearts(4);
        return;
      }

      popupBox.classList.remove("show");
      stopBigEffects();

      if (afterPopupClose) {
        var nextStep = afterPopupClose;
        afterPopupClose = null;
        nextStep();
      }
    };

    // back button: go to the page before
    backButton.onclick = function () {
      if (popupIndex > 0) {
        popupIndex--;
        drawPopupPage();
      }
    };


    // ----- the math page -----
    function showMathPage() {
      extraPages.forEach(function (page) {
        page.classList.add("hide");
      });
      document.getElementById("mathpage").classList.remove("hide");
      replay(document.getElementById("mathpage"), "pagein");
    }

    function checkAnswer() {
      var typed = document.getElementById("ans").value.trim();
      var message = document.getElementById("mmsg");

      if (typed === String(MATH_ANSWER)) {
        message.textContent = "";
        openPopup(REVEAL_TEXT, null, "💕");
      } else {
        message.textContent = WRONG_TEXT;
        replay(message, "swap");
        replay(document.getElementById("ans"), "shake");
      }
    }

    document.getElementById("check").onclick = checkAnswer;

    // pressing Enter also submits
    document.getElementById("ans").addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        checkAnswer();
      }
    });


    // ----- pages 2 and 3 -----
    function showPage(index) {
      document.getElementById("page1").classList.add("hide");

      extraPages.forEach(function (page) {
        page.classList.add("hide");
      });

      extraPages[index].classList.remove("hide");
      replay(extraPages[index], "pagein");
    }

    PAGES.forEach(function (pageInfo, index) {
      var page = document.createElement("div");
      page.className = "hide";
      page.innerHTML =
        '<h1></h1>' +
        '<p class="sub"></p>' +
        '<div class="q"><h2></h2><button class="b yes"></button></div>';

      page.querySelector("h1").textContent = pageInfo.title;
      page.querySelector(".sub").textContent = pageInfo.sub;
      page.querySelector("h2").textContent = pageInfo.question;

      var pageYesButton = page.querySelector(".yes");
      pageYesButton.textContent = pageInfo.yes;

      // add the "No" buttons that run away
      var box = page.querySelector(".q");

      pageInfo.no.forEach(function (noText, j) {
        var pageNoButton = document.createElement("button");
        pageNoButton.className = "b no";
        pageNoButton.textContent = noText;
        pageNoButton.style.left = (10 + j * 45) + "%";
        pageNoButton.style.top = "125px";
        box.appendChild(pageNoButton);
        makeButtonRunAway(pageNoButton);
      });

      // clicking Yes goes to the next page (or the final note if this is the last one)
      pageYesButton.onclick = function () {
        shootHearts(10);

        if (index < PAGES.length - 1) {
          showPage(index + 1);
        } else {
          showFinalNote();
        }
      };

      pagesBox.appendChild(page);
      extraPages.push(page);
    });


    // ----- page 1 "ano yun?" button -> go to page 2 -----
    yesButton.onclick = function () {
      // can't continue until all the hearts are opened
      if (heartsOpened < NOTES.length) {
        return;
      }

      shootHearts(10);
      showPage(0);
    };


    // ----- loading intro ("To My Eri") -----
    (function () {
      var intro = document.getElementById("intro");
      var fill = document.getElementById("introfill");
      var msg = document.getElementById("intromsg");
      var msgIndex = 0;

      fill.style.transitionDuration = INTRO_TIME + "ms";
      msg.textContent = INTRO_MSGS[0];

      // start filling the bar
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          fill.style.width = "100%";
        });
      });

      // change the little message along the way
      var msgTimer = setInterval(function () {
        msgIndex = Math.min(msgIndex + 1, INTRO_MSGS.length - 1);
        msg.textContent = INTRO_MSGS[msgIndex];
      }, INTRO_TIME / INTRO_MSGS.length);

      // after the time is up, fade the intro out
      setTimeout(function () {
        clearInterval(msgTimer);
        openGate();
        intro.classList.add("gone");
        shootHearts(25);

        setTimeout(function () {
          intro.remove();
        }, 1300);
      }, INTRO_TIME);
    })();


    // ----- name gate: only "Eri" or "Erin" can enter -----
    function openGate() {
      var gate = document.getElementById("gate");
      var input = document.getElementById("gateinput");
      var button = document.getElementById("gatebtn");
      var message = document.getElementById("gatemsg");
      var tries = 0;
      var unlocked = false;

      document.getElementById("gatetitle").textContent = GATE_TITLE;
      document.getElementById("gatesub").textContent = GATE_SUB;
      button.textContent = GATE_BUTTON;

      gate.style.display = "flex";
      replay(gate.querySelector(".gateheart"), "pagein");

      function tryEnter() {
        if (unlocked) {
          return;
        }

        var typed = input.value.trim().toLowerCase();

        if (GATE_NAMES.indexOf(typed) !== -1) {
          unlocked = true;
          message.textContent = GATE_OK;
          replay(message, "swap");
          shootHearts(30);

          // now the real page shows up
          setTimeout(function () {
            gate.classList.add("gone");
            document.body.classList.add("started");
            replay(document.getElementById("page1"), "pagein");

            setTimeout(function () {
              gate.remove();
            }, 1100);
          }, 900);
        } else {
          message.textContent = GATE_WRONG[tries % GATE_WRONG.length];
          tries++;
          replay(message, "swap");
          replay(input, "shake");
        }
      }

      button.onclick = tryEnter;
      input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") {
          tryEnter();
        }
      });
    }
  </script>
